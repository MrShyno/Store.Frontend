<aside
  id="layout-menu"
  class="layout-menu menu-vertical menu bg-menu-theme"
  [class.collapsed]="isSidebarCollapsed"
>

  <div class="app-brand demo">
    <a routerLink="/" class="app-brand-link">
      <span class="logo-style">store</span>
    </a>

    <a
      href="javascript:void(0)"
      class="layout-menu-toggle menu-link text-large ms-auto"
      (click)="toggleSidebar()"
    >
      <i class="bx menu-toggle-icon d-none d-xl-block fs-4 align-middle"></i>
      <i class="bx bx-x d-block d-xl-none bx-sm align-middle"></i>
    </a>
  </div>

  <div class="menu-divider mt-0"></div>

  <div class="menu-inner-shadow"></div>

  <ul class="menu-inner py-1">

    <ng-container *ngFor="let item of menuItems">

      <li
        class="menu-item"
        *ngIf="canShowMenu(item)"
        [class.active]="activeMenu === item.title"
        [class.open]="activeMenu === item.title"
      >

        <!-- دارای فرزند -->
        <ng-container *ngIf="item.children?.length; else singleItem">

          <a
            href="javascript:void(0)"
            class="menu-link menu-toggle"
            (click)="toggleMenu(item.title)"
          >
            <i
              *ngIf="item.icon"
              class="menu-icon tf-icons bx"
              [class]="'menu-icon tf-icons bx ' + item.icon"
            ></i>

            <div>{{ item.title }}</div>
          </a>

          <ul
            class="menu-sub"
            [class.show]="activeMenu === item.title"
          >

            <li
              class="menu-item"
              *ngFor="let child of getVisibleChildren(item)"
            >
              <a
                [routerLink]="child.route"
                class="menu-link"
              >
                <div>{{ child.title }}</div>
              </a>
            </li>

          </ul>

        </ng-container>

        <ng-template #singleItem>

          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            class="menu-link"
          >
            <i
              *ngIf="item.icon"
              class="menu-icon tf-icons bx"
              [class]="'menu-icon tf-icons bx ' + item.icon"
            ></i>

            <div>{{ item.title }}</div>
          </a>

        </ng-template>

      </li>

    </ng-container>

  </ul>

</aside>
